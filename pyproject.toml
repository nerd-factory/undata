[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "undata"
dynamic = ["version"]
description = "UN data in Python, without the guessing: an unofficial client for the UN System Data Commons (data.un.org), with SDG progress analysis, publication-ready charts and an MCP connector for AI assistants."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mafizul Islam", email = "samsumon@gmail.com" }]
maintainers = [{ name = "Mafizul Islam", email = "samsumon@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pandas>=2.2.2", "openpyxl>=3.1"]
keywords = [
  "united-nations",
  "un-data",
  "data-commons",
  "sdg",
  "sustainable-development-goals",
  "official-statistics",
  "statistics",
  "open-data",
  "pandas",
  "api-client",
  "mcp",
  "model-context-protocol",
  "data-visualization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.9", "seaborn>=0.13"]
interactive = ["plotly>=5.20"]
mcp = ["mcp>=2.3", "matplotlib>=3.9"]
all = ["matplotlib>=3.9", "seaborn>=0.13", "plotly>=5.20", "mcp>=2.3"]

[project.scripts]
undata = "undata.cli:main"
undata-mcp = "undata.mcp_server:main"

[project.urls]
Homepage = "https://nerd-factory.github.io/undata/"
Documentation = "https://nerd-factory.github.io/undata/reference/"
Source = "https://github.com/nerd-factory/undata"
Issues = "https://github.com/nerd-factory/undata/issues"
Changelog = "https://github.com/nerd-factory/undata/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/nerd-factory/undata/releases"
"Field guide" = "https://mafiatun.github.io/un-data-commons-field-guide/"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "hypothesis>=6.120",
  "mypy>=1.13",
  "ruff>=0.8",
  "pandas-stubs>=2.2",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.20",
  "mcp>=2.3",
]
docs = [
  "sphinx>=8.2",
  "furo>=2025.12.19",
  "sphinx-copybutton>=0.5.2",
  "mcp>=2.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/undata/_version.py"

[tool.hatch.build.targets.sdist]
# Tests and examples ship in the sdist so downstream packagers (conda-forge, Linux
# distributions) can run them. The website and CI configuration do not.
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
]

# ── Tests ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src", "tests"]
addopts = [
  "-ra", "--strict-markers", "--strict-config", "--doctest-modules", "-m", "not live",
]
markers = [
  "live: calls the real data.un.org API (run nightly, or with `-m live`)",
]
filterwarnings = [
  "error",
  # matplotlib 3.9.0, the lowest we support, uses pyparsing names that newer pyparsing
  # deprecates; harmless, and fixed in later matplotlib
  "ignore:.* deprecated - use:DeprecationWarning",
]
xfail_strict = true

[tool.coverage.run]
source = ["undata"]
branch = true
omit = ["src/undata/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# ── Lint and types ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/undata/_version.py"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "D", "S", "PL", "TRY",
]
ignore = [
  "D105",    # magic methods are self-describing
  "D107",    # __init__ is documented on the class
  "PLR0913", # endpoint wrappers mirror the API's own parameters
  "TRY003",  # long messages are the point: errors here explain what to do next
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "PLC0415"]
"tests/**/test_mcp_*.py" = ["E501", "D103", "S101", "PLR2004"]  # one tool call per table row
"examples/**" = ["D103", "S101", "PLR2004"]
"site/**" = ["E501", "PLR2004"]  # SVG string templates and chart geometry
"src/undata/export.py" = ["E501"]  # the generated Power Query (M) lines are kept whole
"src/undata/chart.py" = ["E501", "PLR0911", "PLR0913"]  # drawing calls read better on one line
"src/undata/mcp_server.py" = ["E501", "PLR0913", "PLR0917"]  # tool signatures and descriptions read better whole
"src/undata/_interactive.py" = ["E501", "C901", "PLR0911", "PLR0912", "PLR0915"]  # one branch per chart kind

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
exclude = ["src/undata/_version.py"]

[[tool.mypy.overrides]]
module = ["undata._version", "seaborn", "plotly", "plotly.*"]
ignore_missing_imports = true
